version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: tft-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tft_stats
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tft-redis
    ports:
      - "6379:6379"

volumes:
  db_data: